<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗经 · 关雎蒹葭 · 雅趣闯关</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #2b4a3b 0%, #1e3428 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: '华文楷体', 'KaiTi', '宋体', 'Microsoft YaHei', serif;
            padding: 16px;
            position: relative;
        }

        /* 水墨意境装饰 */
        body::before {
            content: "🌿";
            position: absolute;
            font-size: 160px;
            left: -20px;
            top: -30px;
            opacity: 0.08;
            transform: rotate(-20deg);
            pointer-events: none;
        }

        body::after {
            content: "🪶";
            position: absolute;
            font-size: 140px;
            right: -10px;
            bottom: -30px;
            opacity: 0.08;
            transform: rotate(15deg);
            pointer-events: none;
        }

        .game-container {
            background: #fcf5e8;
            background-image: radial-gradient(circle at 30% 20%, #fffaf0 0%, #f3e7d3 100%);
            width: 100%;
            max-width: 860px;
            border-radius: 40px 40px 32px 32px;
            box-shadow: 0 24px 36px rgba(0, 0, 0, 0.6), 0 0 0 6px #b99b6b, 0 0 0 10px #6b4f2e;
            padding: 24px 28px 32px;
            position: relative;
            border: 2px solid #dac09a;
            transition: all 0.2s;
        }

        /* 卷轴轴头 */
        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            top: 16px;
            bottom: 16px;
            width: 24px;
            background: linear-gradient(90deg, #be9e6b, #8f6e3f);
            border-radius: 30px;
            box-shadow: 0 0 0 3px #5a4126, inset 0 0 10px #f5e0b0;
            z-index: 2;
        }

        .game-container::before {
            left: -14px;
        }

        .game-container::after {
            right: -14px;
        }

        /* 顶部信息 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #dccaa8;
            border-radius: 100px;
            padding: 10px 22px;
            margin-bottom: 22px;
            border: 3px solid #8f6e3f;
            box-shadow: inset 0 4px 8px rgba(255, 240, 190, 0.8), 0 6px 0 #5a4126;
            color: #2d1f0a;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .progress {
            background: #2b1a0a;
            color: #f7eac6;
            padding: 5px 16px;
            border-radius: 40px;
            box-shadow: inset 0 2px 4px #00000066, 0 2px 0 #b99b6b;
            font-size: 1rem;
            border: 1px solid #e3c184;
        }

        .score-badge {
            background: #e3c184;
            padding: 5px 18px;
            border-radius: 30px;
            border: 2px solid #5f3f1e;
            box-shadow: 0 3px 0 #4f3519, inset 0 2px 8px #fef2d6;
            font-size: 1.2rem;
        }

        /* 题目区域 */
        .question-box {
            background: #fff9ef;
            border-radius: 28px;
            padding: 20px 22px;
            border: 3px solid #c8ac7c;
            box-shadow: inset 0 0 20px #ede0c8, 0 8px 0 #a88958;
            margin-bottom: 18px;
        }

        .question-text {
            font-size: 1.5rem;
            color: #2d3e22;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0 #f3e7cf;
            letter-spacing: 2px;
        }

        .question-text .ancient {
            color: #8b5a2b;
            font-size: 1.8rem;
            display: inline-block;
            margin: 0 4px;
            text-shadow: 2px 2px 0 #e3cdb0;
        }

        .hint-text {
            text-align: center;
            font-size: 1rem;
            color: #7a5e3a;
            font-style: italic;
            background: #efe3cd;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
            margin-top: 6px;
            border: 1px dashed #b48b4b;
        }

        /* 选项/互动区 */
        .interaction-area {
            margin: 16px 0 12px;
            min-height: 160px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 12px;
        }

        .option-btn {
            background: #fdf8ec;
            border: 4px solid #b48b4b;
            border-radius: 60px;
            padding: 14px 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2e1e0e;
            cursor: pointer;
            transition: all 0.08s ease;
            box-shadow: 0 7px 0 #8b6a3a, 0 8px 12px rgba(0, 0, 0, 0.15);
            text-align: center;
            font-family: inherit;
            line-height: 1.4;
            word-break: break-word;
            transform: translateY(0);
        }

        .option-btn:hover:not(:disabled) {
            background: #fff5dc;
            transform: scale(1.01);
        }

        .option-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #8b6a3a;
            transform: translateY(5px);
        }

        .option-btn.correct {
            background: #b1d8a8;
            border-color: #2d6e2d;
            box-shadow: 0 4px 0 #1d4a1d, 0 8px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(3px);
            color: #1b3b1b;
        }

        .option-btn.wrong {
            background: #e6b3b3;
            border-color: #a13e3e;
            box-shadow: 0 4px 0 #692121, 0 8px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(3px);
            color: #4a1e1e;
            text-decoration: line-through wavy #b30000 2px;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        /* 连线题特殊样式 */
        .match-container {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            padding: 8px 4px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .match-item {
            background: #f5ead9;
            border: 3px solid #b48b4b;
            border-radius: 40px;
            padding: 12px 14px;
            font-size: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #8b6a3a;
            font-weight: 600;
            color: #2e1e0e;
            position: relative;
        }

        .match-item.selected {
            background: #ffeaa6;
            border-color: #b8860b;
            box-shadow: 0 0 0 3px #f7d96b, 0 5px 0 #8b6a3a;
            transform: scale(1.02);
        }

        .match-item.matched {
            background: #b1d8a8;
            border-color: #2d6e2d;
            box-shadow: 0 3px 0 #1d4a1d;
            cursor: default;
            opacity: 0.8;
            transform: translateY(3px);
        }

        .match-item.matched-wrong {
            background: #e6b3b3;
            border-color: #a13e3e;
            box-shadow: 0 3px 0 #692121;
            cursor: default;
            opacity: 0.8;
            transform: translateY(3px);
        }

        /* 填空题样式 */
        .fill-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f3ead9;
            padding: 18px 14px;
            border-radius: 60px;
            border: 3px dashed #b48b4b;
        }

        .fill-text {
            font-size: 1.4rem;
            color: #2e3d22;
            font-weight: 600;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .fill-blank {
            display: inline-block;
            width: 100px;
            height: 44px;
            background: #fffcf0;
            border: 3px solid #b48b4b;
            border-radius: 20px;
            font-size: 1.3rem;
            text-align: center;
            line-height: 38px;
            color: #2e1e0e;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 2px 6px #d4c2a6;
        }

        .fill-blank.filled {
            background: #e3d5b8;
            border-color: #8b6a3a;
        }

        .fill-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }

        .fill-word {
            background: #fdf8ec;
            border: 3px solid #b48b4b;
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2e1e0e;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #8b6a3a;
        }

        .fill-word:hover:not(:disabled) {
            background: #fff5dc;
            transform: scale(1.02);
        }

        .fill-word:active:not(:disabled) {
            box-shadow: 0 2px 0 #8b6a3a;
            transform: translateY(4px);
        }

        .fill-word.correct {
            background: #b1d8a8;
            border-color: #2d6e2d;
            box-shadow: 0 3px 0 #1d4a1d;
            transform: translateY(3px);
        }

        .fill-word.wrong {
            background: #e6b3b3;
            border-color: #a13e3e;
            box-shadow: 0 3px 0 #692121;
            transform: translateY(3px);
        }

        /* 排序题样式 */
        .order-container {
            background: #f3ead9;
            border-radius: 28px;
            padding: 16px;
            border: 3px dashed #b48b4b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .order-slots {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 60px;
        }

        .order-slot {
            width: 100px;
            height: 54px;
            background: #fffcf0;
            border: 3px solid #b48b4b;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2e1e0e;
            box-shadow: inset 0 2px 8px #d4c2a6;
            cursor: pointer;
            transition: all 0.1s;
            padding: 0 6px;
            text-align: center;
        }

        .order-slot.filled {
            background: #e3d5b8;
            border-color: #8b6a3a;
        }

        .order-words {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 6px 0;
        }

        .order-word {
            background: #fdf8ec;
            border: 3px solid #b48b4b;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2e1e0e;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #8b6a3a;
        }

        .order-word:hover:not(:disabled) {
            background: #fff5dc;
            transform: scale(1.02);
        }

        .order-word:active:not(:disabled) {
            box-shadow: 0 2px 0 #8b6a3a;
            transform: translateY(4px);
        }

        .order-word.used {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: 0 2px 0 #8b6a3a;
            transform: translateY(3px);
        }

        .order-word.correct {
            background: #b1d8a8;
            border-color: #2d6e2d;
        }

        .order-word.wrong {
            background: #e6b3b3;
            border-color: #a13e3e;
        }

        /* 反馈消息 */
        .feedback-message {
            min-height: 50px;
            font-size: 1.3rem;
            text-align: center;
            margin: 10px 0 4px;
            font-weight: bold;
            color: #6a3e1a;
            text-shadow: 1px 1px 0 #fef6d2;
            letter-spacing: 1px;
            padding: 6px 0;
        }

        /* 底部按钮 */
        .footer-actions {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }

        .next-btn {
            background: #d9b382;
            border: none;
            border-radius: 60px;
            padding: 14px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d1d0a;
            border-bottom: 8px solid #8a663a;
            border-right: 2px solid #6d4c28;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 10px 16px rgba(0, 0, 0, 0.25);
            letter-spacing: 4px;
            font-family: inherit;
            transform: translateY(0);
        }

        .next-btn:hover:not(:disabled) {
            background: #e7c79c;
            border-bottom-width: 6px;
            transform: translateY(2px);
        }

        .next-btn:active:not(:disabled) {
            transform: translateY(6px);
            border-bottom-width: 2px;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateY(4px);
            border-bottom-width: 4px;
        }

        /* 结果面板 */
        .result-panel {
            background: #f5e7ce;
            border-radius: 50px;
            padding: 30px 24px;
            text-align: center;
            border: 4px solid #b48b4b;
            box-shadow: inset 0 0 30px #e7cfaa, 0 12px 0 #7a5c3a;
            margin: 12px 0;
        }

        .result-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: #344e2b;
            text-shadow: 3px 3px 0 #dbbc84;
            margin-bottom: 16px;
            letter-spacing: 6px;
        }

        .result-score {
            font-size: 3.4rem;
            background: #2e3d22;
            color: #f5e7b2;
            display: inline-block;
            padding: 6px 40px;
            border-radius: 80px;
            margin: 14px 0;
            border: 3px solid #d9b56a;
            box-shadow: inset 0 -6px 0 #161f0e, 0 8px 0 #382f1b;
            font-weight: 800;
        }

        .result-emoji {
            font-size: 3.6rem;
            line-height: 1.2;
            margin: 6px 0;
        }

        .play-again-btn {
            background: #d9b382;
            border: none;
            border-radius: 60px;
            padding: 14px 44px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #2d1d0a;
            border-bottom: 8px solid #8a663a;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 16px rgba(0, 0, 0, 0.25);
            transition: all 0.08s;
            letter-spacing: 3px;
            font-family: inherit;
        }

        .play-again-btn:hover {
            background: #e7c79c;
            transform: translateY(2px);
            border-bottom-width: 6px;
        }

        .play-again-btn:active {
            transform: translateY(6px);
            border-bottom-width: 2px;
        }

        .hidden {
            display: none !important;
        }

        .bounce {
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 18px 14px 24px;
                border-radius: 30px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .option-btn {
                font-size: 1rem;
                padding: 12px 8px;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .question-text .ancient {
                font-size: 1.4rem;
            }
            .header {
                font-size: 0.9rem;
                padding: 6px 12px;
            }
            .match-container {
                flex-direction: column;
                gap: 16px;
            }
            .match-item {
                font-size: 1rem;
                padding: 10px 8px;
            }
            .order-slot {
                width: 80px;
                height: 48px;
                font-size: 1rem;
            }
            .order-word {
                font-size: 1rem;
                padding: 8px 14px;
            }
            .fill-text {
                font-size: 1.1rem;
            }
            .fill-blank {
                width: 80px;
                height: 40px;
                line-height: 34px;
                font-size: 1.1rem;
            }
            .next-btn {
                font-size: 1.2rem;
                padding: 12px 28px;
            }
            .result-score {
                font-size: 2.6rem;
                padding: 4px 20px;
            }
            .result-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <!-- 顶部状态栏 -->
        <div class="header">
            <span class="progress" id="progressDisplay">第 1 / 10 题</span>
            <span class="score-badge" id="scoreDisplay">✨ 0 分</span>
        </div>

        <!-- 主游戏区域 -->
        <div id="quizArea">
            <div class="question-box">
                <div class="question-text" id="questionText">加载中...</div>
                <div style="text-align: center;" id="hintContainer">
                    <span class="hint-text" id="hintText">🤔 请作答</span>
                </div>
            </div>

            <div class="interaction-area" id="interactionArea">
                <!-- 动态内容 -->
            </div>

            <div class="feedback-message" id="feedbackMsg"></div>

            <div class="footer-actions">
                <button class="next-btn" id="nextBtn" disabled>下一题 ▶</button>
            </div>
        </div>

        <!-- 结果面板 -->
        <div id="resultArea" class="hidden">
            <div class="result-panel">
                <div class="result-title">📜 诗经雅集</div>
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <div class="result-score" id="finalScoreText">0 / 10</div>
                <div id="resultMessage" style="font-size:1.3rem; margin-top:8px; color:#4e3a1e; font-weight:bold;"></div>
                <button class="play-again-btn" id="playAgainBtn">🔄 再来一局</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========== 题库（10题，题型丰富） ==========
            const questions = [
                // 1. 选择题
                {
                    type: 'choice',
                    question: '《关雎》中“关关雎鸠，在河之洲”的“洲”是什么意思？',
                    options: ['水中的陆地', '陆地', '州郡', '河流'],
                    correct: '水中的陆地',
                    hint: '🌊 想想河流中的小岛～'
                },
                // 2. 连线题（两对）
                {
                    type: 'match',
                    question: '将《关雎》中的词语与它的现代意思连起来',
                    pairs: [
                        { left: '窈窕', right: '文静美好' },
                        { left: '好逑', right: '好的配偶' }
                    ],
                    hint: '🔗 点击左边词语，再点击右边对应意思'
                },
                // 3. 填空题
                {
                    type: 'fill',
                    question: '《蒹葭》中：“蒹葭苍苍，白露为霜。所谓伊人，在水一方。” 其中“伊人”指____',
                    blanks: ['那个人'],
                    options: ['那个人', '伊人', '美人', '君子'],
                    hint: '💭 指心中思念的人'
                },
                // 4. 选择题
                {
                    type: 'choice',
                    question: '《蒹葭》中“溯洄从之，道阻且长”的“溯洄”意思是？',
                    options: ['逆流而上', '顺流而下', '沿着河岸走', '渡河'],
                    correct: '逆流而上',
                    hint: '🌊 注意“溯”字有逆流的意思'
                },
                // 5. 排序题
                {
                    type: 'order',
                    question: '请将《关雎》中的诗句按正确顺序排列：',
                    correctOrder: ['关关雎鸠', '在河之洲', '窈窕淑女', '君子好逑'],
                    hint: '📜 按照《关雎》开篇顺序排列'
                },
                // 6. 选择题
                {
                    type: 'choice',
                    question: '《蒹葭》中“蒹葭萋萋，白露未晞”的“晞”是什么意思？',
                    options: ['干', '天亮', '消散', '闪耀'],
                    correct: '干',
                    hint: '☀️ 与露水有关'
                },
                // 7. 连线题（两对）
                {
                    type: 'match',
                    question: '将《蒹葭》中的词语与它的现代意思连起来',
                    pairs: [
                        { left: '溯洄', right: '逆流而上' },
                        { left: '溯游', right: '顺流而下' }
                    ],
                    hint: '🔗 点击左边词语，再点击右边对应意思'
                },
                // 8. 填空题
                {
                    type: 'fill',
                    question: '《关雎》中：“求之不得，寤寐思服。悠哉悠哉，辗转反侧。” “寤寐”指____',
                    blanks: ['日日夜夜'],
                    options: ['日日夜夜', '醒着', '睡着', '做梦'],
                    hint: '🌙 寤=醒，寐=睡'
                },
                // 9. 排序题
                {
                    type: 'order',
                    question: '请将《蒹葭》中的诗句按正确顺序排列：',
                    correctOrder: ['蒹葭苍苍', '白露为霜', '所谓伊人', '在水一方'],
                    hint: '📜 按照《蒹葭》开篇顺序排列'
                },
                // 10. 选择题
                {
                    type: 'choice',
                    question: '《关雎》中“参差荇菜，左右流之”的“流”是什么意思？',
                    options: ['求取', '流动', '漂流', '流水'],
                    correct: '求取',
                    hint: '🌿 这里是采摘、求取的意思'
                }
            ];

            // ========== 状态 ==========
            let currentIndex = 0;
            let score = 0;
            let answered = false;
            let nextDisabled = true;

            // 连线题状态
            let matchSelectedLeft = null;
            let matchPairsMatched = 0;
            let matchTotalPairs = 0;

            // 填空题状态
            let fillSelectedWord = null;
            let fillBlankFilled = false;

            // 排序题状态
            let orderSelectedWords = [];
            let orderCorrectOrder = [];

            // ========== DOM 元素 ==========
            const quizArea = document.getElementById('quizArea');
            const resultArea = document.getElementById('resultArea');
            const progressDisplay = document.getElementById('progressDisplay');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const questionText = document.getElementById('questionText');
            const hintText = document.getElementById('hintText');
            const interactionArea = document.getElementById('interactionArea');
            const feedbackMsg = document.getElementById('feedbackMsg');
            const nextBtn = document.getElementById('nextBtn');
            const playAgainBtn = document.getElementById('playAgainBtn');
            const finalScoreText = document.getElementById('finalScoreText');
            const resultMessage = document.getElementById('resultMessage');
            const resultEmoji = document.getElementById('resultEmoji');

            // ========== 通用函数 ==========
            function updateScoreDisplay() {
                scoreDisplay.textContent = `✨ ${score} 分`;
            }

            function updateProgressDisplay() {
                progressDisplay.textContent = `第 ${currentIndex + 1} / ${questions.length} 题`;
            }

            function setNextButton(state) {
                nextDisabled = state;
                nextBtn.disabled = state;
            }

            function resetFeedback() {
                feedbackMsg.textContent = '';
            }

            // 重置当前题目的状态
            function resetQuestionState() {
                answered = false;
                setNextButton(true);
                resetFeedback();

                // 连线题重置
                matchSelectedLeft = null;
                matchPairsMatched = 0;
                matchTotalPairs = 0;

                // 填空题重置
                fillSelectedWord = null;
                fillBlankFilled = false;

                // 排序题重置
                orderSelectedWords = [];
                orderCorrectOrder = [];
            }

            // ========== 加载题目 ==========
            function loadQuestion(index) {
                const q = questions[index];
                resetQuestionState();

                // 更新进度和得分
                updateProgressDisplay();
                updateScoreDisplay();

                // 设置题目文本
                questionText.innerHTML = q.question;

                // 设置提示
                hintText.textContent = q.hint || '🤔 请作答';

                // 清空交互区
                interactionArea.innerHTML = '';

                // 根据题型构建界面
                switch (q.type) {
                    case 'choice':
                        buildChoiceQuestion(q);
                        break;
                    case 'match':
                        buildMatchQuestion(q);
                        break;
                    case 'fill':
                        buildFillQuestion(q);
                        break;
                    case 'order':
                        buildOrderQuestion(q);
                        break;
                    default:
                        interactionArea.innerHTML = '<p>未知题型</p>';
                }
            }

            // ========== 1. 选择题 ==========
            function buildChoiceQuestion(q) {
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                // 打乱选项顺序
                const shuffled = [...q.options];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                shuffled.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.addEventListener('click', () => handleChoiceClick(btn, opt, q.correct));
                    grid.appendChild(btn);
                });

                interactionArea.appendChild(grid);
            }

            function handleChoiceClick(btn, selected, correct) {
                if (answered) return;
                answered = true;

                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b => {
                    b.disabled = true;
                    if (b.textContent === correct) {
                        b.classList.add('correct');
                    } else if (b === btn && selected !== correct) {
                        b.classList.add('wrong');
                    }
                });

                if (selected === correct) {
                    score++;
                    updateScoreDisplay();
                    feedbackMsg.textContent = '✅ 答对啦！';
                } else {
                    feedbackMsg.textContent = `❌ 正确答案是 “${correct}”`;
                }

                setNextButton(false);
            }

            // ========== 2. 连线题 ==========
            function buildMatchQuestion(q) {
                matchTotalPairs = q.pairs.length;
                matchSelectedLeft = null;
                matchPairsMatched = 0;

                const container = document.createElement('div');
                container.className = 'match-container';

                // 左列
                const leftCol = document.createElement('div');
                leftCol.className = 'match-col';
                // 右列（打乱顺序）
                const rightCol = document.createElement('div');
                rightCol.className = 'match-col';

                const rightValues = q.pairs.map(p => p.right);
                for (let i = rightValues.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rightValues[i], rightValues[j]] = [rightValues[j], rightValues[i]];
                }

                // 构建左列
                q.pairs.forEach((pair, idx) => {
                    const item = document.createElement('div');
                    item.className = 'match-item';
                    item.textContent = pair.left;
                    item.dataset.side = 'left';
                    item.dataset.pairId = idx;
                    item.dataset.value = pair.left;
                    item.addEventListener('click', () => handleMatchLeftClick(item, q));
                    leftCol.appendChild(item);
                });

                // 构建右列
                rightValues.forEach((val, idx) => {
                    const item = document.createElement('div');
                    item.className = 'match-item';
                    item.textContent = val;
                    item.dataset.side = 'right';
                    item.dataset.value = val;
                    item.addEventListener('click', () => handleMatchRightClick(item, q));
                    rightCol.appendChild(item);
                });

                container.appendChild(leftCol);
                container.appendChild(rightCol);
                interactionArea.appendChild(container);
            }

            function handleMatchLeftClick(item, q) {
                if (answered) return;
                // 已配对的不能选
                if (item.classList.contains('matched')) return;

                // 移除其他左项的选中状态
                document.querySelectorAll('.match-item[data-side="left"]').forEach(el => {
                    el.classList.remove('selected');
                });

                item.classList.add('selected');
                matchSelectedLeft = item;
            }

            function handleMatchRightClick(item, q) {
                if (answered) return;
                if (!matchSelectedLeft) {
                    feedbackMsg.textContent = '👈 请先点击左边的词语';
                    return;
                }
                if (item.classList.contains('matched')) return;

                const leftId = parseInt(matchSelectedLeft.dataset.pairId);
                const correctRight = q.pairs[leftId].right;
                const selectedRight = item.dataset.value;

                const leftItem = matchSelectedLeft;

                if (selectedRight === correctRight) {
                    // 配对正确
                    leftItem.classList.remove('selected');
                    leftItem.classList.add('matched');
                    item.classList.add('matched');

                    matchPairsMatched++;
                    feedbackMsg.textContent = '✅ 配对正确！';

                    if (matchPairsMatched === matchTotalPairs) {
                        // 全部配对完成
                        answered = true;
                        score++;
                        updateScoreDisplay();
                        feedbackMsg.textContent = '🎉 全部配对成功！';
                        setNextButton(false);
                    }

                    matchSelectedLeft = null;
                } else {
                    // 配对错误
                    leftItem.classList.remove('selected');
                    leftItem.classList.add('matched-wrong');
                    item.classList.add('matched-wrong');

                    feedbackMsg.textContent = `❌ 配对错误，“${leftItem.textContent}” 应匹配 “${correctRight}”`;

                    // 短暂延迟后恢复（但标记已错，不可再改）
                    setTimeout(() => {
                        leftItem.classList.remove('matched-wrong');
                        item.classList.remove('matched-wrong');
                        leftItem.classList.add('matched'); // 锁住
                        item.classList.add('matched');
                    }, 800);

                    // 记录这题已错，但允许继续配对剩下的？为了简单，直接结束本题
                    // 但我们设置 answered = true 后，其他点击无效
                    answered = true;
                    // 把所有未配对的锁住
                    document.querySelectorAll('.match-item').forEach(el => {
                        if (!el.classList.contains('matched') && !el.classList.contains('matched-wrong')) {
                            el.classList.add('matched');
                        }
                    });
                    // 得分不加
                    setNextButton(false);
                    matchSelectedLeft = null;
                }
            }

            // ========== 3. 填空题 ==========
            function buildFillQuestion(q) {
                const container = document.createElement('div');
                container.className = 'fill-container';

                // 题干文字
                const textDiv = document.createElement('div');
                textDiv.className = 'fill-text';
                textDiv.textContent = q.question.replace(/____/g, ''); // 简化展示

                // 空白格子
                const blank = document.createElement('span');
                blank.className = 'fill-blank';
                blank.textContent = '?';
                blank.id = 'fillBlank';

                // 将空白插入到文本中
                textDiv.appendChild(blank);

                container.appendChild(textDiv);

                // 选项词
                const optDiv = document.createElement('div');
                optDiv.className = 'fill-options';

                const shuffledOpts = [...q.options];
                for (let i = shuffledOpts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledOpts[i], shuffledOpts[j]] = [shuffledOpts[j], shuffledOpts[i]];
                }

                shuffledOpts.forEach(word => {
                    const wordBtn = document.createElement('button');
                    wordBtn.className = 'fill-word';
                    wordBtn.textContent = word;
                    wordBtn.addEventListener('click', () => handleFillClick(wordBtn, word, q));
                    optDiv.appendChild(wordBtn);
                });

                container.appendChild(optDiv);
                interactionArea.appendChild(container);
            }

            function handleFillClick(btn, word, q) {
                if (answered) return;

                const blank = document.getElementById('fillBlank');
                const correct = q.blanks[0];

                if (word === correct) {
                    blank.textContent = word;
                    blank.classList.add('filled');
                    btn.classList.add('correct');
                    answered = true;
                    score++;
                    updateScoreDisplay();
                    feedbackMsg.textContent = '✅ 填对啦！';
                    setNextButton(false);

                    // 禁用所有选项
                    document.querySelectorAll('.fill-word').forEach(b => b.disabled = true);
                } else {
                    btn.classList.add('wrong');
                    btn.disabled = true;
                    feedbackMsg.textContent = `❌ “${word}” 不对哦，再试试～`;
                }
            }

            // ========== 4. 排序题 ==========
            function buildOrderQuestion(q) {
                orderCorrectOrder = q.correctOrder;
                orderSelectedWords = [];

                const container = document.createElement('div');
                container.className = 'order-container';

                // 槽位显示区
                const slotsDiv = document.createElement('div');
                slotsDiv.className = 'order-slots';
                slotsDiv.id = 'orderSlots';

                // 创建与正确顺序等量的槽位
                q.correctOrder.forEach((_, idx) => {
                    const slot = document.createElement('div');
                    slot.className = 'order-slot';
                    slot.dataset.index = idx;
                    slot.textContent = '?';
                    slot.addEventListener('click', () => handleSlotClick(idx));
                    slotsDiv.appendChild(slot);
                });

                container.appendChild(slotsDiv);

                // 打乱词语
                const shuffledWords = [...q.correctOrder];
                for (let i = shuffledWords.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledWords[i], shuffledWords[j]] = [shuffledWords[j], shuffledWords[i]];
                }

                // 词语选择区
                const wordsDiv = document.createElement('div');
                wordsDiv.className = 'order-words';

                shuffledWords.forEach(word => {
                    const wordBtn = document.createElement('button');
                    wordBtn.className = 'order-word';
                    wordBtn.textContent = word;
                    wordBtn.dataset.word = word;
                    wordBtn.addEventListener('click', () => handleOrderWordClick(wordBtn, word));
                    wordsDiv.appendChild(wordBtn);
                });

                container.appendChild(wordsDiv);
                interactionArea.appendChild(container);
            }

            function handleOrderWordClick(btn, word) {
                if (answered) return;

                // 找到第一个空槽
                const slots = document.querySelectorAll('.order-slot');
                let emptySlot = null;
                for (let slot of slots) {
                    if (slot.textContent === '?') {
                        emptySlot = slot;
                        break;
                    }
                }

                if (!emptySlot) {
                    feedbackMsg.textContent = '⚠️ 所有空位已填满，点击已填的槽位可以取消';
                    return;
                }

                // 填入
                emptySlot.textContent = word;
                emptySlot.classList.add('filled');
                emptySlot.dataset.filledWord = word;

                btn.classList.add('used');
                btn.disabled = true;

                orderSelectedWords.push({ slot: emptySlot, word: word, btn: btn });

                // 检查是否填满
                const allFilled = [...slots].every(s => s.textContent !== '?');
                if (allFilled) {
                    checkOrderAnswer();
                }
            }

            function handleSlotClick(index) {
                if (answered) return;

                const slots = document.querySelectorAll('.order-slot');
                const slot = slots[index];
                if (slot.textContent === '?') return; // 空的不用处理

                const word = slot.dataset.filledWord;
                // 清除槽位
                slot.textContent = '?';
                slot.classList.remove('filled');
                delete slot.dataset.filledWord;

                // 恢复对应按钮
                const wordBtns = document.querySelectorAll('.order-word');
                wordBtns.forEach(btn => {
                    if (btn.dataset.word === word && btn.classList.contains('used')) {
                        btn.classList.remove('used');
                        btn.disabled = false;
                    }
                });

                // 从记录中移除
                orderSelectedWords = orderSelectedWords.filter(item => item.slot !== slot);
            }

            function checkOrderAnswer() {
                if (answered) return;

                const slots = document.querySelectorAll('.order-slot');
                let allCorrect = true;

                for (let i = 0; i < slots.length; i++) {
                    const slot = slots[i];
                    const userWord = slot.dataset.filledWord;
                    const correctWord = orderCorrectOrder[i];

                    if (userWord !== correctWord) {
                        allCorrect = false;
                        slot.style.background = '#e6b3b3';
                        slot.style.borderColor = '#a13e3e';
                    } else {
                        slot.style.background = '#b1d8a8';
                        slot.style.borderColor = '#2d6e2d';
                    }
                }

                answered = true;

                if (allCorrect) {
                    score++;
                    updateScoreDisplay();
                    feedbackMsg.textContent = '🎉 排序完全正确！';
                } else {
                    feedbackMsg.textContent = `❌ 顺序有误，正确顺序是：${orderCorrectOrder.join(' → ')}`;
                }

                setNextButton(false);

                // 禁用所有词语按钮
                document.querySelectorAll('.order-word').forEach(b => b.disabled = true);
            }

            // ========== 下一题 / 结果 ==========
            function goToNext() {
                if (!answered) return;

                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    loadQuestion(currentIndex);
                } else {
                    showResult();
                }
            }

            function showResult() {
                quizArea.classList.add('hidden');
                resultArea.classList.remove('hidden');

                finalScoreText.textContent = `${score} / ${questions.length}`;

                let emoji = '📖';
                let message = '';
                if (score === 10) {
                    emoji = '🏆👑🎉';
                    message = '诗经大师！受小生一拜！';
                } else if (score >= 8) {
                    emoji = '🎓✨';
                    message = '博古通今，才子/才女呀！';
                } else if (score >= 6) {
                    emoji = '📚😊';
                    message = '不错不错，再读两篇诗经就完美啦～';
                } else if (score >= 4) {
                    emoji = '🌱🤔';
                    message = '有点意思，继续加油哟！';
                } else {
                    emoji = '🍃😢';
                    message = '别灰心，再玩一遍就记住啦！';
                }
                resultEmoji.textContent = emoji;
                resultMessage.textContent = message;
            }

            // ========== 重置游戏 ==========
            function resetGame() {
                currentIndex = 0;
                score = 0;
                answered = false;

                resultArea.classList.add('hidden');
                quizArea.classList.remove('hidden');

                updateScoreDisplay();
                loadQuestion(0);
            }

            // ========== 事件绑定 ==========
            nextBtn.addEventListener('click', goToNext);
            playAgainBtn.addEventListener('click', resetGame);

            // ========== 初始化 ==========
            function init() {
                currentIndex = 0;
                score = 0;
                answered = false;
                resultArea.classList.add('hidden');
                quizArea.classList.remove('hidden');
                updateScoreDisplay();
                loadQuestion(0);
            }

            init();

            // 键盘回车支持
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (!quizArea.classList.contains('hidden') && !nextBtn.disabled) {
                        nextBtn.click();
                    } else if (!resultArea.classList.contains('hidden')) {
                        playAgainBtn.click();
                    }
                }
            });

        })();
    </script>
</body>
</html>
